name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpsDesk.sln --configfile NuGet.Config

      - name: Restore local tools
        run: dotnet tool restore

      - name: Slopwatch
        run: dotnet slopwatch analyze --fail-on warning

      - name: Build
        run: dotnet build OpsDesk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpsDesk.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
