name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpsDesk.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build OpsDesk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpsDesk.sln --configuration Release --no-build
